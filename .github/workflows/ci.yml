name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Pakete bauen
        run: python3 tools/build.py
      - name: Userscript prüfen
        run: node --check dist/entgender-*.user.js
      - name: Firefox-Paket prüfen
        run: npx --yes web-ext lint --source-dir dist/firefox --warnings-as-errors
