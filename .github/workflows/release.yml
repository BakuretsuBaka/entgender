name: Release

# Läuft, sobald auf GitHub ein Release veröffentlicht wird (Releases > Draft a new release,
# dort ein neues Tag wie v1.0.1 anlegen). Baut die Pakete und das Userscript und hängt sie an das Release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Pakete bauen
        run: python3 tools/build.py
      - name: Firefox-Paket prüfen
        run: npx --yes web-ext lint --source-dir dist/firefox --warnings-as-errors
      - name: Pakete an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/*.user.js --clobber
